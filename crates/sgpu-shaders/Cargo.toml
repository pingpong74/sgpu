[package]
name = "sgpu-shaders"
version.workspace = true
edition.workspace = true
description = "Shader-side bindless ABI for sgpu"
license = "MIT"
repository = "https://github.com/pingpong74/sgpu"
readme = "Readme.md"
keywords = ["vulkan", "spirv", "shaders", "gpu"]
categories = ["graphics", "rendering"]

[dependencies]
spirv-std = "0.10.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }
